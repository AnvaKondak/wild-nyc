<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Neighbors you've met</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F5BEA}a:hover{color:#1F3FB0}
</style>
</helmet>
<div style="width: 390px; height: 1220px; box-sizing: border-box; background: #FAF7F2; color: #1A1A2E; font-family: 'Instrument Sans', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">

<header style="padding: 56px 22px 0; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #55546A">9 of 40 have moved in</div>
<h1 style="margin: 0; font-family: 'Fraunces', serif; font-size: 36px; font-weight: 600; line-height: 1.05; text-shadow: 3px 3px 0 #FFD23F">Neighbors <span style="font-style: italic; font-weight: 400; color: #FF6B9A">you've met</span></h1>
</header>

<div style="margin: 18px 16px 0; width: 358px; height: 560px; position: relative; border-radius: 24px; overflow: hidden; border: 2px solid #1A1A2E; box-sizing: border-box; box-shadow: 5px 5px 0 #FF6B9A">
<svg width="354" height="556" viewBox="0 0 358 560" fill="none" style="position: absolute; left: 0; top: 0">
<rect width="358" height="560" fill="#FFE3EC"></rect>
<circle cx="296" cy="74" r="34" fill="#FF6B9A" fill-opacity="0.5"></circle>
<circle cx="290" cy="70" r="34" fill="#FFD23F"></circle>
<g fill="#DDE6FF">
<rect x="150" y="150" width="40" height="120"></rect><rect x="196" y="120" width="34" height="150"></rect><rect x="236" y="170" width="46" height="100"></rect><rect x="288" y="140" width="30" height="130"></rect><rect x="322" y="180" width="36" height="90"></rect>

<rect x="0" y="120" width="150" height="330" fill="#FAF7F2" stroke="#1A1A2E" stroke-width="1.5"></rect>
<g fill="#2F5BEA" fill-opacity="0.85">
<rect x="16" y="140" width="22" height="30"></rect><rect x="62" y="140" width="22" height="30"></rect><rect x="108" y="140" width="22" height="30"></rect>
<rect x="16" y="222" width="22" height="30"></rect><rect x="62" y="222" width="22" height="30"></rect><rect x="108" y="222" width="22" height="30"></rect>
<rect x="16" y="304" width="22" height="30"></rect><rect x="62" y="304" width="22" height="30"></rect><rect x="108" y="304" width="22" height="30"></rect>
</g>
<rect x="0" y="198" width="158" height="7" fill="#1A1A2E"></rect>
<rect x="0" y="280" width="158" height="7" fill="#1A1A2E"></rect>
<rect x="0" y="116" width="154" height="6" fill="#1A1A2E"></rect>
<path d="M150 172 Q240 210 330 152" stroke="#1A1A2E" stroke-width="1.5"></path>
<path d="M330 120 V450" stroke="#1A1A2E" stroke-width="5" stroke-linecap="round"></path>
<path d="M318 140 H342" stroke="#1A1A2E" stroke-width="3" stroke-linecap="round"></path>
<rect x="231" y="300" width="16" height="130" fill="#1A1A2E"></rect>
<circle cx="246" cy="276" r="72" fill="#FF6B9A" fill-opacity="0.55"></circle>
<circle cx="240" cy="270" r="72" fill="#2F5BEA"></circle>
<rect x="0" y="450" width="358" height="52" fill="#F1EBDD"></rect>
<rect x="156" y="400" width="164" height="44" rx="22" fill="#FF6B9A" fill-opacity="0.55"></rect>
<rect x="152" y="396" width="164" height="44" rx="22" fill="#2F5BEA"></rect>
<rect x="84" y="436" width="62" height="18" fill="#FAF7F2" stroke="#1A1A2E" stroke-width="1.5"></rect>
<g fill="#FF6B9A"><circle cx="94" cy="430" r="6"></circle><circle cx="108" cy="426" r="7"></circle><circle cx="122" cy="430" r="6"></circle><circle cx="136" cy="427" r="6"></circle></g>
<g fill="#FFD23F"><circle cx="94" cy="430" r="2"></circle><circle cx="108" cy="426" r="2.4"></circle><circle cx="122" cy="430" r="2"></circle><circle cx="136" cy="427" r="2"></circle></g>
<rect x="18" y="430" width="40" height="44" rx="4" fill="#C9C6D6" stroke="#1A1A2E" stroke-width="1.5"></rect>
<rect x="14" y="424" width="48" height="8" rx="3" fill="#1A1A2E"></rect>
<rect x="0" y="502" width="358" height="58" fill="#E6E2D8"></rect>
<path d="M14 532h36M74 532h36M134 532h36M194 532h36M254 532h36M314 532h36" stroke="#FFD23F" stroke-width="4" stroke-linecap="round"></path>
</svg>

<sc-for list="{{spots}}" as="n" hint-placeholder-count="13">
<button onClick="{{n.pick}}" aria-label="{{n.aria}}" aria-pressed="{{n.selected}}" style="position: absolute; left: {{n.x}}px; top: {{n.y}}px; width: 46px; height: 46px; border-radius: 23px; background: {{n.fill}}; border: {{n.border}}; box-shadow: {{n.ring}}; transform: rotate({{n.tilt}}deg); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; box-sizing: border-box; opacity: {{n.op}}">
<svg width="28" height="28" viewBox="0 0 48 48" fill="none" stroke="{{n.ink}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.d}}"></path></svg>
</button>
</sc-for>
</div>

<section style="margin: 20px 16px 0; padding: 20px; border-radius: 22px; background: {{sel.bg}}; color: {{sel.fg}}; border: 1.5px solid #1A1A2E; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; color: {{sel.kickerColor}}">{{sel.kicker}}</div>
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 10px">
<div style="font-family: 'Fraunces', serif; font-size: 28px; font-weight: 600; line-height: 1">{{sel.name}}</div>
<div style="font-family: 'Fraunces', serif; font-style: italic; font-size: 15px">{{sel.noun}}</div>
</div>
<div style="font-size: 15px; line-height: 1.45">{{sel.line}}</div>
<sc-if value="{{sel.met}}" hint-placeholder-val="{{ true }}">
<a href="{{sel.href}}" style="align-self: flex-start; margin-top: 4px; min-height: 44px; padding: 0 18px; border-radius: 22px; background: #FFD23F; border: 1.5px solid #1A1A2E; color: #1A1A2E; display: flex; align-items: center; font-weight: 600; font-size: 14px; text-decoration: none; box-sizing: border-box">Visit their page</a>
</sc-if>
</section>

<a href="#" style="margin: 14px 16px 0; min-height: 52px; border-radius: 26px; border: 1.5px solid #1A1A2E; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; color: #1A1A2E; font-weight: 600; font-size: 15px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5M5 14v6h14v-6"></path></svg>
Share your neighborhood
</a>

<nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #FFFFFF; border-top: 1.5px solid #1A1A2E; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding-bottom: 18px; box-sizing: border-box">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #55546A; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"></path></svg>Right now</a>
<a href="BlockMap.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #55546A; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9H3z"></path><path d="M10 20v-5h4v5"></path></svg>Places</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #1A1A2E; font-size: 11px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="9" r="3"></circle><circle cx="16" cy="9" r="3"></circle><path d="M2 20c0-3 3-5 6-5s6 2 6 5M12 20c0-3 2-5 4-5s6 2 6 5"></path></svg>Neighbors</a>
<a href="Kindness.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #55546A; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"></path></svg>Kindness</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1220}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { picked: "pigeons" };
}
renderVals() {
var self = this;
var bird = "M8 28c6 0 10-4 14-10 2-3 5-5 9-5 3 0 5 2 6 4l4 1-4 2c0 7-6 13-15 13H10";
var squirrel = "M30 40c-8 0-13-6-13-13 0-5 3-8 7-9-3-5-1-13 6-13 8 0 11 10 5 16 4 2 6 6 5 11-1 5-5 8-10 8z";
var critter = "M6 30c2-7 9-11 17-11 6 0 10 3 12 6l6 1-4 3c0 3-3 5-6 5H14c-3 0-6-1-8-4z";
var bug = "M24 14v22M24 20c-4-8-16-10-16-2 0 6 8 8 16 6M24 20c4-8 16-10 16-2 0 6-8 8-16 6M24 26c-3 4-10 8-10 12 0 3 6 2 10-6M24 26c3 4 10 8 10 12 0 3-6 2-10-6";
var all = [
{ id: "pigeons", name: "Pigeons", noun: "a kit", met: true, x: 44, y: 154, fill: "#FFE3EC", d: bird, line: "Moved in Sept 12. They live on the ledges, which feel like the sea cliffs their ancestors nested on.", href: "Pigeon.dc.html" },
{ id: "starlings", name: "Starlings", noun: "a murmuration", met: true, x: 196, y: 166, fill: "#FFF4C7", d: bird, line: "Moved in Sept 14. They hang out on the wire, chattering and doing impressions of car alarms." },
{ id: "doves", name: "Mourning Doves", noun: "a piteousness", met: true, x: 270, y: 150, fill: "#FFE3EC", d: bird, line: "Moved in Sept 15. That soft hooting at dawn is them, sitting side by side on the wire." },
{ id: "gulls", name: "Gulls", noun: "a colony", met: true, x: 140, y: 34, fill: "#DDE6FF", d: bird, line: "Moved in Sept 13. Always overhead, always riding the wind off the river." },
{ id: "squirrels", name: "Squirrels", noun: "a scurry", met: true, x: 248, y: 236, fill: "#FFF4C7", d: squirrel, line: "Moved in Sept 12. The tree is home base, and every planter is their pantry." },
{ id: "sparrows", name: "Sparrows", noun: "a host", met: true, x: 184, y: 394, fill: "#DDE6FF", d: bird, line: "Moved in Sept 12. The hedge is their clubhouse, and the curb is their bathtub." },
{ id: "robins", name: "Robins", noun: "a round", met: true, x: 286, y: 452, fill: "#FFE3EC", d: bird, line: "Moved in Sept 18. They show up on the grass right after it rains." },
{ id: "raccoons", name: "Raccoons", noun: "a gaze", met: true, x: 14, y: 384, fill: "#DDE6FF", d: critter, line: "Moved in Sept 20. The night shift. You know where to find them." },
{ id: "monarchs", name: "Monarchs", noun: "a kaleidoscope", met: true, x: 100, y: 380, fill: "#FFD23F", d: bug, line: "Moved in Sept 22, just passing through on the way to Mexico." },
{ id: "hawk", name: "Red-tailed Hawk", noun: "a kettle", met: false, x: 56, y: 66, d: bird, line: "Not met yet. Look up at rooftops and light poles for a big bird sitting very still." },
{ id: "jay", name: "Blue Jays", noun: "a party", met: false, x: 196, y: 238, d: bird, line: "Not met yet. Listen for a loud, bossy call from the treetops." },
{ id: "juncos", name: "Juncos", noun: "a flock", met: false, x: 128, y: 458, d: bird, line: "Not met yet, but arriving now. Look for little gray birds hopping under the hedge." },
{ id: "opossum", name: "Opossums", noun: "a passel", met: false, x: 236, y: 452, d: critter, line: "Not met yet. They come out after dark, often along fences." }
];
var picked = this.state.picked;
var tilts = [-6, 4, -3, 6, -5, 3, -4];
var sel = all[0];
var spots = all.map(function (n, i) {
var isSel = n.id === picked;
if (isSel) sel = n;
return Object.assign({}, n, {
selected: isSel,
fill: n.met ? n.fill : "rgba(250,247,242,0.6)",
border: n.met ? "3px solid #FFFFFF" : "2px dashed #55546A",
ink: n.met ? "#1A1A2E" : "#55546A",
op: n.met ? 1 : 0.85,
ring: isSel ? "0 0 0 4px #FFD23F, 3px 3px 0 4px #1A1A2E" : (n.met ? "2px 2px 0 #1A1A2E" : "none"),
tilt: n.met ? tilts.at(i % tilts.length) : 0,
aria: (n.met ? "Show " : "Not met yet: ") + n.name,
pick: function () { self.setState({ picked: n.id }); }
});
});
return {
spots: spots,
sel: {
name: sel.name, noun: sel.noun, line: sel.line, met: sel.met, href: sel.href || "#",
kicker: sel.met ? "Your neighbor" : "Waiting to move in",
bg: sel.met ? "#2F5BEA" : "#FFFFFF",
fg: sel.met ? "#FFFFFF" : "#1A1A2E",
kickerColor: sel.met ? "#FFD23F" : "#55546A"
}
};
}
}
</script>
</body>
</html>
