# Fly.io config for the Wild Neighbors API (deploy from the repo root; see docs/DEPLOY.md).
app = "wild-neighbors-api"
primary_region = "ewr" # Newark, next door to NYC and Jersey City

[build]
  dockerfile = "server/Dockerfile"

[env]
  RAILS_ENV = "production"
  PORT = "8080"
  RAILS_LOG_LEVEL = "info"
  WILD_SERIES_DIR = "/data/series"

# The time-series store lives on this volume. One machine only: the worker is the
# store's single writer, and it runs next to the web server (server/api/bin/start).
[mounts]
  source = "series"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off" # the worker fetches iNaturalist and eBird on a schedule
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/up"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
